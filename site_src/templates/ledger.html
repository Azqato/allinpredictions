{% extends "base.html" %}
{% block title %}Full Ledger &middot; {{ site_title }}{% endblock %}
{% block content %}
<section class="section-head">
  <h1>Full Ledger</h1>
  <p class="muted">Every confidently-attributed prediction sitewide ({{ ledger_count }} total). Filter and search below.</p>
</section>

<div class="chart-controls">
  <input type="search" id="ledger-search" placeholder="Search predictions&hellip;" aria-label="Search predictions" />
  <select id="ledger-year-filter" aria-label="Filter by year">
    <option value="">All years</option>
    {% for y in years %}
    <option value="{{ y }}">{{ y }}</option>
    {% endfor %}
  </select>
  <select id="ledger-topic-filter" aria-label="Filter by topic">
    <option value="">All topics</option>
    {% for t in topics %}
    <option value="{{ t }}">{{ t|tag_display }}</option>
    {% endfor %}
  </select>
  <select id="ledger-result-filter" aria-label="Filter by result">
    <option value="">All results</option>
    {% for r in ["right", "wrong", "ambiguous", "inconclusive", "unvalidated"] %}
    <option value="{{ r }}">{{ r|verdict_display }}</option>
    {% endfor %}
  </select>
</div>

<p class="muted" id="ledger-count"></p>
<div class="predictions" id="ledger-results" data-src="static/ledger.json"></div>
{% endblock %}
